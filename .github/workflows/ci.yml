name: CI

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

jobs:
  testsuite:
    name: "Test Suite"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
        db-type: [mysql, pgsql, sqlite, agnostic]
        symfony-version: ['7-min', '7-max']
    env:
      DB_NAME: 'propel_tests'
      DB_USER: 'propel'
      DB_PW: 'propel'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL
        if: matrix.db-type == 'pgsql'
        uses: CasperWA/postgresql-action@v1.2
        with:
          postgresql db: ${{ env.DB_NAME }}
          postgresql user: ${{ env.DB_USER }}
          postgresql password: ${{ env.DB_PW }}

      - name: Install MySQL
        if: matrix.db-type == 'mysql'
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql root password: ${{ env.DB_PW }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, libxml, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: pcov

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Use Symfony ${{ matrix.symfony-version }} composer.json
        run: mv tests/composer/composer-symfony${{ matrix.symfony-version }}.json composer.json

      - name: Composer install
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Wait for MySQL
        if: matrix.db-type == 'mysql'
        run: |
          for i in {1..10}; do
            mysqladmin -h 127.0.0.1 -u root status >/dev/null 2>&1 && exit 0 || sleep 6
            echo 'Waiting for MySQL...'
          done
          echo 'MySQL did not start'
          exit 1
        env:
          MYSQL_PWD: ${{ env.DB_PW }}

      - name: Create MySQL user
        if: matrix.db-type == 'mysql'
        run: |
          mysql -h 127.0.0.1 -u root -e "
            CREATE USER '${{ env.DB_USER }}'@'localhost' IDENTIFIED BY '${{ env.DB_PW }}';
            CREATE USER '${{ env.DB_USER }}'@'%' IDENTIFIED BY '${{ env.DB_PW }}';
            GRANT ALL PRIVILEGES ON *.* TO '${{ env.DB_USER }}'@'localhost';
            GRANT ALL PRIVILEGES ON *.* TO '${{ env.DB_USER }}'@'%';
            FLUSH PRIVILEGES;
          "
        env:
          MYSQL_PWD: ${{ env.DB_PW }}

      - name: Setup test database
        if: matrix.db-type != 'agnostic'
        run: tests/bin/setup.${{ matrix.db-type }}.sh

      - name: Run tests
        run: vendor/bin/phpunit -c tests/${{ matrix.db-type }}.phpunit.xml --colors=always --coverage-clover=coverage.xml

      - name: Upload coverage artifact
        if: matrix.php-version == '8.3' && matrix.symfony-version == '7-max'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.db-type }}
          path: coverage.xml

  code-quality:
    name: "Code Quality"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, libxml, pdo, pdo_mysql, pdo_pgsql

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate

      - name: Composer install
        run: composer install --prefer-dist --no-interaction

      - name: PHPStan
        run: composer stan

      - name: Psalm
        run: composer psalm

      - name: Code Style
        run: composer cs-check
